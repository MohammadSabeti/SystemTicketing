{% extends 'base.html' %}
{% load static %}
{% block title %}ورود به سیستم{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4 mt-md-5">
    <div class="col-12 col-md-8 col-lg-5 col-xl-4">
        <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
            <!-- هدر کارت -->
            <div class="card-header text-center border-0 bg-white pt-4 pb-2">
                <div class="mb-2">
                    <span class="d-inline-flex justify-content-center align-items-center rounded-circle bg-primary bg-opacity-10 text-primary"
                          style="width: 56px; height: 56px;">
                        <i class="fas fa-sign-in-alt fs-4"></i>
                    </span>
                </div>
                <h3 class="mb-1 fw-bold">ورود به حساب کاربری</h3>
                <p class="text-muted small mb-0">
                    برای مشاهده و مدیریت تیکت‌ها وارد حساب کاربری خود شوید.
                </p>
            </div>

            <!-- بدنه فرم -->
            <div class="card-body px-4 pb-4 pt-3">
                <form method="post" novalidate>
                    {% csrf_token %}

                    <div class="mt-3">
                        <label for="username" class="form-label small text-muted mb-1">نام کاربری</label>
                        <input type="text"
                               class="form-control rounded-3"
                               id="username"
                               name="username"
                               placeholder="نام کاربری خود را وارد کنید"
                               autocomplete="username"
                               required>
                    </div>

                    <div class="mt-3">
                        <label for="password" class="form-label small text-muted mb-1">رمز عبور</label>
                        <input type="password"
                               class="form-control rounded-3"
                               id="password"
                               name="password"
                               placeholder="رمز عبور"
                               autocomplete="current-password"
                               required>
                    </div>

                    <button type="submit"
                            class="btn btn-primary w-100 mt-4 py-2 rounded-pill d-flex align-items-center justify-content-center gap-2 shadow-sm">
                        <i class="fas fa-door-open"></i>
                        <span>ورود</span>
                    </button>

                    <div class="text-center mt-3 small">
                        حساب کاربری ندارید؟
                        <a href="{% url 'accounts:register' %}" class="fw-semibold text-decoration-none">
                            ثبت‌نام کنید
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
