{% extends 'base.html' %}
{% load static %}
{% block title %}ورود به سیستم{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-5">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-header text-center border-0 bg-white pt-4">
                <div class="mb-2">
                    <span class="d-inline-flex justify-content-center align-items-center rounded-circle bg-primary bg-opacity-10 text-primary"
                          style="width: 56px; height: 56px;">
                        <i class="fas fa-sign-in-alt fs-4"></i>
                    </span>
                </div>
                <h3 class="mb-1">ورود به حساب کاربری</h3>
                <p class="text-muted small mb-0">
                    برای مشاهده و مدیریت تیکت‌ها وارد حساب کاربری خود شوید.
                </p>
            </div>
            <div class="card-body px-4 pb-4 pt-3">
                <form method="post">
                    {% csrf_token %}
                    <div class="mt-3">
                        <label for="username" class="form-label">نام کاربری</label>
                        <input type="text" class="form-control" id="username" name="username"
                               placeholder="نام کاربری" required>
                    </div>

                    <div class="mt-3">
                        <label for="password" class="form-label">رمز عبور</label>
                        <input type="password" class="form-control" id="password" name="password"
                               placeholder="رمز عبور" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 mt-4 py-2">
                        <i class="fas fa-door-open me-2"></i>
                        ورود
                    </button>

                    <div class="text-center mt-3 small">
                        حساب کاربری ندارید؟
                        <a href="{% url 'accounts:register' %}" class="fw-semibold">ثبت‌نام کنید</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
