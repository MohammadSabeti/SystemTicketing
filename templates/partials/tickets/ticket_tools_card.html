{% load static %}
{% load ticket_tags %}
<div class="card shadow-lg border-0 rounded-4 mb-3">
    <div class="card-header bg-white border-bottom-0 pt-4 pb-2 px-4">
        <h6 class="mb-0 fw-bold">
            <i class="fas fa-toolbox text-primary me-2"></i>
            ابزارها
        </h6>
    </div>

    <div class="card-body p-4 d-flex flex-column gap-2">
        <a href="{% url 'tickets:ticket_list' %}"
           class="btn btn-light rounded-pill px-4 py-2 text-start d-flex align-items-center gap-2 shadow-sm transition-all hover-effect">
            <i class="fas fa-list text-primary"></i>
            <span class="fw-semibold">لیست تیکت‌ها</span>
        </a>

        {% if user.is_admin %}
            <a href="{% url 'admin:index' %}"
               class="btn btn-light rounded-pill px-4 py-2 text-start d-flex align-items-center gap-2 shadow-sm transition-all hover-effect">
                <i class="fas fa-cogs text-warning"></i>
                <span class="fw-semibold">پنل مدیریت</span>
            </a>
        {% endif %}

        <a href="{% url 'tickets:ticket_form' %}"
           class="btn btn-light rounded-pill px-4 py-2 text-start d-flex align-items-center gap-2 shadow-sm transition-all hover-effect">
            <i class="fas fa-plus-circle text-success"></i>
            <span class="fw-semibold">تیکت جدید</span>
        </a>
    </div>

    <!-- خلاصه آمار -->
    <div class="card-footer bg-light border-top-0 p-4">
        <div class="row g-2 text-center">
            <div class="col-6">
                <div class="p-3 rounded-3 bg-white shadow-sm">
                    <div class="fs-5 fw-bold text-primary">
                        <i class="fas fa-comment-dots"></i>
                    </div>

                    <small class="fw-semibold">پیام</small>
                    <small class="text-muted d-block">{{ ticket.ticket_messages.count }}</small>
                </div>
            </div>
            <div class="col-6">
                <div class="p-3 rounded-3 bg-white shadow-sm">
                    <div class="fs-5 fw-bold"
                         style="color: {% render_status_color ticket.status %}">
                        <i class="fas fa-flag"></i>
                    </div>
                    <small class="text-muted d-block">وضعیت</small>
                    <small class="fw-semibold"> {% render_status_badge ticket.status %} </small>
                </div>
            </div>
        </div>
    </div>
</div>
